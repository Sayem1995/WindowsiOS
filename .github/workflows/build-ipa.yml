name: ipa
on:
  workflow_dispatch:
jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - run: brew install xcodegen meson ninja pkg-config python
      - run: bash scripts/ci_build.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ipa
          path: out/WindowsiOS-unsigned.ipa
          if-no-files-found: warn
